name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      # Build the installer but do NOT let electron-builder upload it:
      # its GitHub publisher races the release creation against the large .exe
      # upload and exits 0 having uploaded only the small .blockmap. We upload
      # the artifacts deterministically with the gh CLI instead. electron-builder
      # still emits latest.yml (the electron-updater feed) because publish:github
      # is configured in electron-builder.yml.
      - name: Package NSIS installer
        run: npx electron-builder --win --publish never

      - name: Publish artifacts to the GitHub Release
        shell: bash
        run: |
          set -e
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Flux Terminal $GITHUB_REF_NAME — see CHANGELOG.md" "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
